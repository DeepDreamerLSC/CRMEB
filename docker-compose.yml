services:
  php:
    build: ./docker
    container_name: crmeb_php
    working_dir: /var/www
    volumes:
      - ./crmeb:/var/www
    environment:
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [crmeb]

  nginx:
    image: nginx:1.27-alpine
    container_name: crmeb_nginx
    ports:
      - "8787:80"
    volumes:
      - ./crmeb:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks: [crmeb]

  mysql:
    image: mysql:8.0
    container_name: crmeb_mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --sql_mode=NO_ENGINE_SUBSTITUTION
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: crmeb
      MYSQL_USER: crmeb
      MYSQL_PASSWORD: crmeb123
      TZ: Asia/Shanghai
    volumes:
      - crmeb_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [crmeb]

  redis:
    image: redis:7-alpine
    container_name: crmeb_redis
    networks: [crmeb]

volumes:
  crmeb_mysql:

networks:
  crmeb:
