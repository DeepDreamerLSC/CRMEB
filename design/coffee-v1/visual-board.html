<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COFFEE · 界面设计</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1e7d8;color:#302923;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{max-width:1600px;margin:auto;padding:30px 28px 20px;display:flex;align-items:end;justify-content:space-between;gap:20px}h1{font:400 25px "Songti SC",serif;margin:0 0 7px}header p{font-size:12px;color:#7a6c5d;margin:0}nav{display:flex;gap:6px;flex-wrap:wrap}button,.download{font:12px inherit;border:1px solid #c6bbab;background:transparent;border-radius:3px;padding:9px 17px;cursor:pointer;color:inherit}button[aria-pressed=true]{background:#302923;border-color:#302923;color:#f8f5ef}button:focus-visible,a:focus-visible{outline:2px solid #94654a;outline-offset:3px}.wrap{padding:0 22px 25px}.stage{position:relative;max-width:1642px;margin:auto;overflow:hidden;box-shadow:0 8px 35px #3d302814;border-radius:5px}.stage img{width:100%;display:block}.stage.single{width:min(100%,420px);aspect-ratio:365/855}.stage.single img{position:absolute;width:449.863%;max-width:none;top:-9.006%;left:var(--left)}.caption{text-align:center;color:#766b5d;font-size:12px;margin:18px 0;line-height:1.8}.footer{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;padding:0 22px 30px;font-size:11px;color:#7b7061}.footer a{color:inherit;text-underline-offset:3px}.download{font-size:11px;text-decoration:none} @media(max-width:720px){header{align-items:start;flex-direction:column;padding:22px 16px}nav{gap:5px}button{padding:8px 13px}.wrap{padding:0 12px 18px}h1{font-size:23px}.caption{padding:0 16px}}
</style></head>
<body><header><div><h1>COFFEE / 沙与时间</h1><p>首页 / 商品 / 购物车 / 我的</p></div><nav aria-label="设计稿视图"><button data-view="all" aria-pressed="true">四屏总览</button><button data-view="0" aria-pressed="false">首页</button><button data-view="1" aria-pressed="false">商品</button><button data-view="2" aria-pressed="false">购物车</button><button data-view="3" aria-pressed="false">我的</button></nav></header>
<main><div class="wrap"><div class="stage"><img src="coffee-four-tabs-type-v6.png" alt="精品咖啡小程序四屏设计：首页含透光咖啡棕、简化沙漏标志、选购与 400g 拼团入口，商品页展示产地风味目录，购物车含两件商品合计 164 元，我的页面含订单、拼团和售后。"></div></div><p class="caption" aria-live="polite">选择栏目，查看单页。<br>品牌与商品信息为示例。</p></main>
<footer class="footer"><a class="download" href="coffee-four-tabs-type-v6.png" download>下载设计稿 ↗</a><a href="layout-study.html">早期交互草稿</a><span>TYPE 06 / 2026.10.20</span></footer>
<script>const offsets=[52,444,835,1228],labels=['首页','商品','购物车','我的'];document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{const stage=document.querySelector('.stage');const view=button.dataset.view;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b===button));stage.classList.toggle('single',view!=='all');if(view!=='all')stage.style.setProperty('--left',-(offsets[+view]/365*100)+'%');document.querySelector('.stage img').alt=view==='all'?'精品咖啡小程序首页、商品、购物车、我的四屏设计稿':labels[+view]+'设计稿的放大视图';}));</script></body></html>
